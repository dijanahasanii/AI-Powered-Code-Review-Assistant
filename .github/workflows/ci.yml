name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: https://test.supabase.local
          SUPABASE_SERVICE_KEY: test-service-role-placeholder
          JWT_SECRET: test-secret-at-least-32-characters-long-for-jest-suite
          TOKEN_ENCRYPTION_KEY_CURRENT: a1b2c3d4e5f6789012345678abcdef9012345678abcdef9012345678abcdef90
          TOKEN_ENCRYPTION_KEY_PREVIOUS: fedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
          GITHUB_CLIENT_ID: test-github-oauth-client-id
          GITHUB_CLIENT_SECRET: test-github-oauth-client-secret
