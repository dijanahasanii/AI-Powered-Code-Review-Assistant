# Local full stack: Express + Vite (in-process review jobs — no Redis required).
#
# Data persists through Supabase (PostgREST), not a bundled Postgres container.
# Copy backend/.env.example → backend/.env (and frontend) before first run.
# Do NOT set QUEUE_DRIVER=redis in backend/.env unless you also run Redis (see README §11).
#
# Optional production-like queue: docker compose --profile redis up
# https://docs.docker.com/compose/compose-file/05-services/#env_file

services:
  redis:
    profiles: ['redis']
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
        required: false
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Bind mount hides image node_modules; npm ci restores devDependencies in the anonymous volume.
    command: ['sh', '-c', 'npm ci && npm run dev']

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=http://localhost:3001
    env_file:
      - path: ./frontend/.env
        required: false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ['sh', '-c', 'npm ci && npm run dev -- --host']

volumes:
  redis_data:
