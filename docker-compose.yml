# Local full stack: Redis + Bull worker + Express + Vite.
#
# The app persists data through Supabase (PostgREST), not a bundled Postgres container.
# Create backend/.env and frontend/.env from *.env.example before first run, or rely on
# optional env_file (Docker Compose v2.24+). Minimum for backend: SUPABASE_URL,
# SUPABASE_SERVICE_KEY, JWT_SECRET (>= 16 chars), GITHUB_* and BACKEND_URL for OAuth/webhooks.
#
# https://docs.docker.com/compose/compose-file/05-services/#env_file

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - QUEUE_DRIVER=redis
      - REDIS_URL=redis://redis:6379
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Bind mount hides image node_modules; npm ci restores devDependencies in the anonymous volume.
    command: ["sh", "-c", "npm ci && npm run dev"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=http://localhost:3001
    env_file:
      - path: ./frontend/.env
        required: false
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --host"]

volumes:
  redis_data:
